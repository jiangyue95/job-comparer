spring:
  application:
    name: job-comparer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}    # Default value is dev, it can be overridden by environment variables
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "init"
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-5
          temperature: 0.7
          max-tokens: 2048
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
  servlet:
    multipart:
      max-file-size: 2MB    # maximum size of a single file
      max-request-size: 2MB # maximum size of the entire request

app:
  ai:
    default-provider: anthropic
  analysis:
    daily-limit-global: 10
  quota:
    limits:
      free:
        max-cvs: 10
        max-jobs: 50
        daily-analyses: 3
      premium:
        unlimited: true

  admin:
    email: ${APP_ADMIN_EMAIL}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000  # 1 hour in ms

aws:
  s3:
    region: ${AWS_REGION}
    bucket: ${AWS_S3_BUCKET}

server:
  forward-headers-strategy: framework
