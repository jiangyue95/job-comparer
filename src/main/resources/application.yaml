spring:
  application:
    name: job-comparer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}    # Default value is dev, it can be overridden by environment variables
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "init"
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-5
          temperature: 0.7
          max-tokens: 2048

app:
  analysis:
    daily-limit-per-user: 3
    daily-limit-global: 10

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000  # 1 hour in ms
